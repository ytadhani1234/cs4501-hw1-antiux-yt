<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Antiusabilius | Resolution Terminal</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body class="anti-page review-page" data-page="review">
  <main class="site-shell">
    <header class="interior-header"><a href="./index.html" class="hotel-mini">Hotel Antiusabilius</a><span>Resolution Environment</span></header>
    <p class="decorative-text">Final matters may include previously encountered particulars.</p>
    <h1>Resolution Terminal</h1>
    <div class="review-noise"><strong>THE RESOLUTION DESK IS AVAILABLE</strong><span>Concierge-adjacent excellence in administrative closure</span></div>
    <details class="booking-details"><summary>Supplementary Accommodation Metadata</summary><dl id="review-summary"></dl></details>

    <form id="review-form" novalidate>
      <div class="recall-box">
        <label for="entered-code">Re-enter the Transient Accommodation Identifier presented earlier.</label>
        <input id="entered-code" name="enteredCode" type="text" autocomplete="off" spellcheck="false" required>
      </div>
      <div id="review-error" class="form-error review-error" role="alert" hidden><p id="review-error-text"></p><ul id="review-parameter-list" hidden></ul><a id="review-error-link" href="./results.html">Return to Accommodation Candidates</a></div>
      <div class="action-row review-actions"><button class="red-continue" type="submit">Finalize Reservation</button><button id="abort-review" class="green-cancel" type="button">Abort / Return</button></div>
    </form>
  </main>
</body>
</html>
